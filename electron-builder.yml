appId: com.svanny.banji
productName: Banji
copyright: Copyright © 2026 Svanny

directories:
  output: release
  buildResources: resources

nodeGypRebuild: false
npmRebuild: false

files:
  - out/**/*
  - package.json

extraResources:
  - from: build/release-resources/bin
    to: bin
    filter:
      - '**/*'

artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

mac:
  target:
    - dmg
  category: public.app-category.business
  icon: resources/mac/banji.icns

win:
  target:
    - nsis
  icon: resources/mac/icon.png

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/mac/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
