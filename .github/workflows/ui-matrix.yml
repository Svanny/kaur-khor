name: ui-matrix

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ui-matrix:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      KAUR_KHOR_UI_MATRIX_WEB_PORT: "5176"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set test browser path
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/kaur-khor-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install test browser
        run: pnpm exec playwright install chromium

      - name: Run desktop, browser, and mobile UI matrix
        run: pnpm ui:matrix

      - name: Save diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-matrix-screenshots
          path: ui-matrix-results/playwright-artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 7
