name: deploy-frontend-staging

on:
  workflow_dispatch:
    inputs:
      railway_debug:
        description: "Enable safe verbose Railway deploy debug logs"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy-frontend-staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: staging
      RAILWAY_STAGING_FRONTEND_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_FRONTEND_SERVICE_ID }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Load deploy flags from config
        env:
          RAILWAY_DEBUG_INPUT: ${{ inputs.railway_debug }}
        run: |
          bash tool/ci/load_deploy_flags.sh "$RAILWAY_ENVIRONMENT" "$RAILWAY_DEBUG_INPUT" >> "$GITHUB_ENV"
      - name: Ensure cached bin path is on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Railway CLI
        run: bash tool/ci/install_railway_cli.sh
      - name: Resolve target frontend service id
        run: |
          set -euo pipefail
          target_service_id="${RAILWAY_STAGING_FRONTEND_SERVICE_ID:-}"

          if [[ -z "$target_service_id" ]]; then
            echo "error: missing frontend Railway service id for staging" >&2
            exit 1
          fi

          echo "RAILWAY_SERVICE_ID=$target_service_id" >> "$GITHUB_ENV"
      - name: Deploy frontend service
        run: bash tool/ci/deploy_frontend.sh
      - name: Write deploy summary
        if: always()
        run: |
          {
            echo "## Frontend Deploy"
            echo "- Environment: $RAILWAY_ENVIRONMENT"
            echo "- Service id: $RAILWAY_SERVICE_ID"
            echo "- Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
