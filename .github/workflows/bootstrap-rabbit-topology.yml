name: bootstrap-rabbit-topology

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod
      rabbit_vhost:
        description: "RabbitMQ vhost"
        required: true
        default: /
        type: string
      confirm_prod_bootstrap:
        description: "Required for prod dispatch: type CONFIRM_PROD_BOOTSTRAP"
        required: false
        type: string

permissions:
  contents: read

jobs:
  bootstrap-topology:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    env:
      BANJI_SYSTEM: banji-core
      BANJI_ENV: ${{ inputs.target_env }}
      RABBIT_VHOST: ${{ inputs.rabbit_vhost }}
      RABBIT_MANAGEMENT_API_BASE_URL: ${{ secrets.RABBIT_MANAGEMENT_API_BASE_URL }}
      RABBIT_MANAGEMENT_USERNAME: ${{ secrets.RABBIT_MANAGEMENT_USERNAME }}
      RABBIT_MANAGEMENT_PASSWORD: ${{ secrets.RABBIT_MANAGEMENT_PASSWORD }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Validate required inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BANJI_ENV" == "prod" && "${{ inputs.confirm_prod_bootstrap }}" != "CONFIRM_PROD_BOOTSTRAP" ]]; then
            echo "error: prod topology bootstrap requires confirm_prod_bootstrap=CONFIRM_PROD_BOOTSTRAP" >&2
            exit 1
          fi

      - name: Bootstrap RabbitMQ topology
        shell: bash
        run: bash tool/ci/bootstrap_rabbit_topology.sh

      - name: Write topology summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RabbitMQ Topology Bootstrap"
            echo "- Environment: ${BANJI_ENV}"
            echo "- Vhost: ${RABBIT_VHOST}"
            echo "- Jobs exchange: ${BANJI_SYSTEM}.${BANJI_ENV}.jobs"
            echo "- Replay exchange: ${BANJI_SYSTEM}.${BANJI_ENV}.jobs.replay"
            echo "- DLX exchange: ${BANJI_SYSTEM}.${BANJI_ENV}.jobs.dlx"
            echo "- Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
