name: deploy-keycloak

on:
  workflow_dispatch:
    inputs:
      railway_debug:
        description: "Enable safe verbose Railway deploy debug logs"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy-keycloak:
    runs-on: ubuntu-latest
    environment: staging
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: staging
      RAILWAY_STAGING_KEYCLOAK_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_KEYCLOAK_SERVICE_ID }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Load deploy flags from config
        env:
          RAILWAY_DEBUG_INPUT: ${{ inputs.railway_debug }}
        run: |
          bash tool/ci/load_deploy_flags.sh "$RAILWAY_ENVIRONMENT" "$RAILWAY_DEBUG_INPUT" >> "$GITHUB_ENV"
      - name: Set up deploy tooling (cached)
        uses: ./.github/actions/deploy-tooling
      - name: Resolve target Keycloak service id
        run: |
          set -euo pipefail
          target_service_id="${RAILWAY_STAGING_KEYCLOAK_SERVICE_ID:-}"

          if [[ -z "$target_service_id" ]]; then
            echo "error: missing Keycloak Railway service id for staging" >&2
            exit 1
          fi

          echo "RAILWAY_SERVICE_ID=$target_service_id" >> "$GITHUB_ENV"
      - name: Verify Railway auth and service link
        env:
          RAILWAY_DEBUG_INPUT: ${{ inputs.railway_debug }}
        run: |
          set -euo pipefail

          if [[ -n "${RAILWAY_TOKEN:-}" ]]; then
            echo "error: RAILWAY_TOKEN is no longer supported for deploy; use RAILWAY_API_TOKEN only." >&2
            exit 1
          fi

          if [[ -z "${RAILWAY_API_TOKEN:-}" ]]; then
            echo "error: RAILWAY_API_TOKEN is required." >&2
            exit 1
          fi

          if ! railway whoami >/dev/null 2>&1; then
            echo "error: Railway CLI auth check failed (railway whoami)." >&2
            exit 1
          fi

          railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$RAILWAY_SERVICE_ID" </dev/null >/dev/null
      - name: Deploy Keycloak service
        run: railway up services/keycloak --path-as-root --service "$RAILWAY_SERVICE_ID" --detach
      - name: Write deploy summary
        if: always()
        run: |
          {
            echo "## Keycloak Deploy"
            echo "- Environment: $RAILWAY_ENVIRONMENT"
            echo "- Service id: $RAILWAY_SERVICE_ID"
            echo "- Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
