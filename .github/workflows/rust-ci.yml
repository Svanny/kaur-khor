name: rust-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/rust-ci.yml'
      - '.github/workflows/release-build.yml'
      - '.github/workflows/deploy.yml'
      - 'tool/ci/**'
  push:
    branches-ignore: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/rust-ci.yml'
      - '.github/workflows/release-build.yml'
      - '.github/workflows/deploy.yml'
      - 'tool/ci/**'

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/api/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Run rustfmt check
        working-directory: apps/api
        run: cargo +stable fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/api/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Run clippy
        working-directory: apps/api
        run: cargo +stable clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/api/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Run tests
        working-directory: apps/api
        run: cargo +stable test --all --all-features

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/api/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build release binary
        working-directory: apps/api
        run: cargo +stable build --release

  container-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Build container image (no push)
        run: docker build -f apps/api/Dockerfile -t banji-api:pr-${{ github.sha }} .

  migration-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banji_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/banji_ci
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install sqlx-cli
        run: cargo +stable install sqlx-cli --no-default-features --features rustls,postgres
      - name: Validate migrations apply cleanly to fresh DB
        run: sqlx migrate run --source apps/api/migrations --database-url "$DATABASE_URL"

  sqlx-offline-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banji_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/banji_ci
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install sqlx-cli
        run: cargo +stable install sqlx-cli --no-default-features --features rustls,postgres
      - name: Verify sqlx offline metadata
        run: bash tool/ci/sqlx_offline_verify.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Run actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.4/scripts/download-actionlint.bash | bash
          ./actionlint -color

  cargo-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit
      - name: Audit dependencies (wall-tier, non-blocking)
        working-directory: apps/api
        run: cargo +stable audit
