name: rust-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'config/ci/**'
      - 'config/env/**'
      - 'services/keycloak/**'
      - '.github/workflows/rust-ci.yml'
      - '.github/workflows/release-build.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-keycloak.yml'
      - 'tool/ci/**'
      - 'tool/otel/**'
      - 'tool/security/**'
  push:
    branches-ignore: [main]
    paths:
      - 'apps/api/**'
      - 'config/ci/**'
      - 'config/env/**'
      - 'services/keycloak/**'
      - '.github/workflows/rust-ci.yml'
      - '.github/workflows/release-build.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-keycloak.yml'
      - 'tool/ci/**'
      - 'tool/otel/**'
      - 'tool/security/**'

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Scan tracked files for secret leakage
        run: bash tool/security/check_secret_patterns.sh

  migration-version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Validate sqlx migration versions are unique
        run: bash tool/ci/check_migration_versions.sh

  ci-script-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Check topology parity contract tests
        run: bash tool/ci/test_check_topology_parity.sh
      - name: Check Railway sync + up contract tests
        run: bash tool/ci/test_railway_sync_and_up.sh
      - name: Check OIDC runtime readiness contract tests
        run: bash tool/ci/test_check_oidc_runtime_ready.sh
      - name: Check Railway commit parity contract tests
        run: bash tool/ci/test_check_railway_commit_parity.sh
      - name: Check deploy flag loader tests
        run: bash tool/ci/test_load_deploy_flags.sh
      - name: Check migration version contract tests
        run: bash tool/ci/test_check_migration_versions.sh
      - name: Check migration lock contract tests
        run: bash tool/ci/test_migrate_with_lock.sh

  pooling-contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Validate pooled runtime env contracts
        run: |
          grep -q '^DATABASE_RUNTIME_ENDPOINT_KIND=direct$' config/env/dev.env
          grep -q '^DATABASE_RUNTIME_ENDPOINT_KIND=pgbouncer$' config/env/staging.env
          grep -q '^DATABASE_RUNTIME_ENDPOINT_KIND=pgbouncer$' config/env/prod.env
          grep -q '^PGBOUNCER_POOL_MODE=transaction$' config/env/staging.env
          grep -q '^PGBOUNCER_POOL_MODE=transaction$' config/env/prod.env
          grep -q '^EDGE_ENFORCEMENT_ENABLED=true$' config/env/staging.env
          grep -q '^EDGE_ENFORCEMENT_ENABLED=true$' config/env/prod.env

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/api/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Run rustfmt check
        working-directory: apps/api
        run: cargo +stable fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/api/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Run clippy
        working-directory: apps/api
        run: cargo +stable clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banji_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_RUNTIME_URL: postgres://postgres:postgres@localhost:5432/banji_ci
      DATABASE_RUNTIME_ENDPOINT_KIND: direct
      PGBOUNCER_POOL_MODE: session
      SQLX_POOL_MAX_CONNECTIONS: 10
      SQLX_POOL_MIN_CONNECTIONS: 1
      SQLX_POOL_ACQUIRE_TIMEOUT_MS: 2000
      SQLX_POOL_CONNECT_TIMEOUT_MS: 2000
      SQLX_POOL_IDLE_TIMEOUT_SECONDS: 300
      SQLX_POOL_MAX_LIFETIME_SECONDS: 1800
      POSTGRES_CONNECTION_BUDGET_TOTAL: 80
      CACHE_SCHEMA_VERSION: v1
      REDIS_URL: redis://localhost:6379
      CACHE_ENABLED: true
      OTEL_ENABLED: false
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/api/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Run tests
        working-directory: apps/api
        run: cargo +stable test --all --all-features

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/api/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build release binary
        working-directory: apps/api
        run: cargo +stable build --release

  container-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build container image (no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          load: false
          tags: banji-api:pr-${{ github.sha }}
          cache-from: type=gha,scope=banji-api-pr
          cache-to: type=gha,mode=max,scope=banji-api-pr
      - name: Build Keycloak container image (no push)
        uses: docker/build-push-action@v6
        with:
          context: services/keycloak
          file: services/keycloak/Dockerfile
          push: false
          load: false
          tags: banji-keycloak:pr-${{ github.sha }}
          cache-from: type=gha,scope=banji-keycloak-pr
          cache-to: type=gha,mode=max,scope=banji-keycloak-pr

  migration-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banji_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/banji_ci
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install sqlx-cli
        run: cargo +stable install sqlx-cli --no-default-features --features rustls,postgres
      - name: Validate migrations apply cleanly to fresh DB
        run: |
          sqlx migrate run --source apps/api/migrations --database-url "$DATABASE_URL"
          # Re-run to verify idempotence and reduce local-dev drift risk.
          sqlx migrate run --source apps/api/migrations --database-url "$DATABASE_URL"

  sqlx-offline-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banji_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/banji_ci
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install sqlx-cli
        run: cargo +stable install sqlx-cli --no-default-features --features rustls,postgres
      - name: Verify sqlx offline metadata
        run: bash tool/ci/sqlx_offline_verify.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Run actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.4/scripts/download-actionlint.bash | bash
          ./actionlint -color

  cargo-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Install stable rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit
      - name: Audit dependencies (wall-tier, non-blocking)
        working-directory: apps/api
        run: cargo +stable audit
