name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run security gate
        shell: bash
        env:
          KAUR_KHOR_REQUIRE_NETWORK_AUDIT: "1"
        run: bash tool/security/run_security_checks.sh

  build:
    name: package-${{ matrix.platform }}-${{ matrix.arch }}
    needs: security-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync package version from tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the format v0.1.4, got: ${RELEASE_TAG}" >&2
            exit 1
          fi
          npm pkg set version="${release_version}"
          echo "Packaging version $(node -p "require('./package.json').version") from tag ${RELEASE_TAG}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Package macOS release
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export ALLOW_UNSIGNED_PACKAGING=1
          fi
          bash scripts/package-mac.sh

      - name: Package Windows release
        if: matrix.platform == 'win'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${WIN_CSC_LINK:-${CSC_LINK:-}}" || -z "${WIN_CSC_KEY_PASSWORD:-${CSC_KEY_PASSWORD:-}}" ]]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD CSC_LINK CSC_KEY_PASSWORD
            export ALLOW_UNSIGNED_PACKAGING=1
          fi
          pnpm package:win:native

      - name: Package Linux release
        if: matrix.platform == 'linux'
        shell: bash
        run: bash scripts/package-linux.sh

      - name: Collect packaged artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.platform }}" in
            mac)
              cp release/*.dmg dist/
              ;;
            win)
              cp release/*.exe dist/
              ;;
            linux)
              cp release/*.AppImage dist/
              cp release/*.deb dist/
              ;;
            *)
              echo "Unknown platform ${{ matrix.platform }}" >&2
              exit 1
              ;;
          esac
          ls -la dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Verify artifact set
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          test -n "$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-linux-arm64.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-linux-x64.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-linux-arm64.deb' -print -quit)"

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS

      - name: Build release notes
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mac_signed="no"
          mac_notarized="no"
          windows_signed="no"

          if [[ -n "${CSC_LINK:-}" && -n "${CSC_KEY_PASSWORD:-}" ]]; then
            mac_signed="yes"
          fi

          if [[ -n "${CSC_LINK:-}" && -n "${CSC_KEY_PASSWORD:-}" && -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            mac_notarized="yes"
          fi

          if [[ -n "${WIN_CSC_LINK:-${CSC_LINK:-}}" && -n "${WIN_CSC_KEY_PASSWORD:-${CSC_KEY_PASSWORD:-}}" ]]; then
            windows_signed="yes"
          fi

          notes_path="${RUNNER_TEMP}/release-notes.md"
          release_version="${RELEASE_TAG#v}"
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" --match 'v*.*.*' 2>/dev/null || true)"

          {
            echo "## Highlights"
            echo
            echo "- Restored automatic zoom-in and zoom-out behavior for embedded phone landscape layouts in both demo and browser app routes."
            echo "- Moved demo and browser onboarding banners into the page flow so they no longer float over the onboarding panel."
            echo "- Simplified the demo embedded banner by removing the browser-app CTA while keeping backup, import, reset, and main-page actions available."
            echo "- Improved the phone rotate warning with a solid centered card, zoomed-out artwork, and English/Khmer onboarding-style flip copy."
            echo
            echo "## Downloads"
            echo
            echo "- macOS: DMG builds for Intel and Apple Silicon"
            echo "- Windows: NSIS installer for x64"
            echo "- Linux: AppImage and .deb packages for x64 and arm64"
            echo
            echo "## Signing status"
            echo
            echo "- macOS signing: ${mac_signed}"
            echo "- macOS notarization: ${mac_notarized}"
            echo "- Windows signing: ${windows_signed}"
            echo "- Linux signing: no (standard unsigned Linux desktop artifacts)"
            echo
            echo "If a platform shows unsigned, the installer is still published, but the operating system may display extra trust warnings during install."
            echo
            echo "## Included files"
            echo
            echo "- Release artifacts for all supported desktop platforms"
            echo "- Bundled kaur-khor-desktop-core runtime inside every desktop app package"
            echo "- SHA256SUMS for every attached asset"
            if [[ -n "${previous_tag}" ]]; then
              echo
              echo "## Changes since ${previous_tag}"
              echo
              git log --first-parent --format="- %s (%h)" "${previous_tag}..${RELEASE_TAG}"
            else
              echo
              echo "## Changes in ${release_version}"
              echo
              git log --first-parent --format="- %s (%h)" "${RELEASE_TAG}"
            fi
          } > "${notes_path}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes_path="${RUNNER_TEMP}/release-notes.md"
          title="Kaur Khor ${RELEASE_TAG}"

          if gh release view "${RELEASE_TAG}" --repo "${RELEASE_REPO}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --repo "${RELEASE_REPO}" --title "${title}" --notes-file "${notes_path}"
          else
            gh release create "${RELEASE_TAG}" --repo "${RELEASE_REPO}" --title "${title}" --notes-file "${notes_path}"
          fi

          gh release upload "${RELEASE_TAG}" dist/* --repo "${RELEASE_REPO}" --clobber
