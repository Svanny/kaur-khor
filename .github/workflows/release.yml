name: release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag source
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} must point at a commit reachable from main." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ hashFiles('apps/desktop-core/Cargo.lock', 'apps/desktop-core/Cargo.toml', 'apps/sena-core/Cargo.lock', 'apps/sena-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-registry-

      - name: Cache Cargo targets
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            apps/desktop-core/target
            apps/sena-core/target
            build/cargo-target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-target-${{ hashFiles('apps/desktop-core/Cargo.lock', 'apps/desktop-core/Cargo.toml', 'apps/sena-core/Cargo.lock', 'apps/sena-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-target-

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run security gate
        shell: bash
        env:
          KAUR_KHOR_REQUIRE_NETWORK_AUDIT: "1"
        run: bash tool/security/run_security_checks.sh

  build:
    name: package-${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: windows-2025-vs2026
            platform: win
            arch: x64
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Sync package version from tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the format v0.1.4, got: ${RELEASE_TAG}" >&2
            exit 1
          fi
          npm pkg set version="${release_version}"
          echo "Packaging version $(node -p "require('./package.json').version") from tag ${RELEASE_TAG}"

      - name: Setup pnpm
        uses: pnpm/action-setup@ac6db6d3c1f721f886538a378a2d73e85697340a
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ hashFiles('apps/desktop-core/Cargo.lock', 'apps/desktop-core/Cargo.toml', 'apps/sena-core/Cargo.lock', 'apps/sena-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-registry-

      - name: Cache Cargo targets
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            apps/desktop-core/target
            apps/sena-core/target
            build/cargo-target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-target-${{ hashFiles('apps/desktop-core/Cargo.lock', 'apps/desktop-core/Cargo.toml', 'apps/sena-core/Cargo.lock', 'apps/sena-core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-target-

      - name: Cache Electron downloads
        if: matrix.platform == 'mac'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ matrix.arch }}-electron-${{ hashFiles('pnpm-lock.yaml', 'electron-builder.yml', 'electron-builder.unsigned-win.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ matrix.arch }}-electron-
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Cache Electron downloads
        if: matrix.platform == 'linux'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ matrix.arch }}-electron-${{ hashFiles('pnpm-lock.yaml', 'electron-builder.yml', 'electron-builder.unsigned-win.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ matrix.arch }}-electron-
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Cache Electron downloads
        if: matrix.platform == 'win'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ matrix.arch }}-electron-v2-${{ hashFiles('pnpm-lock.yaml', 'electron-builder.yml', 'electron-builder.unsigned-win.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ matrix.arch }}-electron-v2-
            ${{ runner.os }}-${{ runner.arch }}-electron-v2-

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Package macOS release
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export ALLOW_UNSIGNED_PACKAGING=1
          fi
          bash scripts/package-mac.sh

      - name: Package Windows release
        if: matrix.platform == 'win'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          KAUR_KHOR_SKIP_INSTALLER_HANDOFF: "1"
        run: |
          set -euo pipefail
          if [[ -z "${WIN_CSC_LINK:-${CSC_LINK:-}}" || -z "${WIN_CSC_KEY_PASSWORD:-${CSC_KEY_PASSWORD:-}}" ]]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD CSC_LINK CSC_KEY_PASSWORD
            export ALLOW_UNSIGNED_PACKAGING=1
          fi
          pnpm package:win:native

      - name: Package Linux release
        if: matrix.platform == 'linux'
        shell: bash
        env:
          KAUR_KHOR_SKIP_INSTALLER_HANDOFF: "1"
        run: bash scripts/package-linux.sh

      - name: Collect packaged artifacts
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.platform }}" in
            mac)
              cp release/*.dmg dist/
              ;;
            win)
              cp release/*.exe dist/
              ;;
            linux)
              cp release/*.AppImage dist/
              cp release/*.deb dist/
              ;;
            *)
              echo "Unknown platform ${{ matrix.platform }}" >&2
              exit 1
              ;;
          esac
          ls -la dist

      - name: Upload release artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: publish-release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs:
      - security-gate
      - build

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Build production source-build archive
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/package-source-release.mjs

      - name: Verify artifact set
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          test -n "$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-linux-x64.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-linux-arm64.AppImage' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-linux-x64.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-linux-arm64.deb' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name 'kaur-khor-v*-source-build.tar.gz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name 'kaur-khor-latest-source-build.tar.gz' -print -quit)"

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS

      - name: Build release notes
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/build-release-notes.mjs "${RUNNER_TEMP}/release-notes.md"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes_path="${RUNNER_TEMP}/release-notes.md"
          title="Kaur Khor ${RELEASE_TAG}"

          if gh release view "${RELEASE_TAG}" --repo "${RELEASE_REPO}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --repo "${RELEASE_REPO}" --title "${title}" --notes-file "${notes_path}"
          else
            gh release create "${RELEASE_TAG}" --repo "${RELEASE_REPO}" --title "${title}" --notes-file "${notes_path}"
          fi

          gh release upload "${RELEASE_TAG}" dist/* --repo "${RELEASE_REPO}" --clobber
