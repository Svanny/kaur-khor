name: shutdown-railway-staging

on:
  workflow_dispatch:
    inputs:
      railway_debug:
        description: "Enable safe verbose Railway shutdown logs"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  shutdown-railway-staging:
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-db-ops
      cancel-in-progress: false
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: staging
      RAILWAY_STAGING_API_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_API_SERVICE_ID }}
      RAILWAY_STAGING_EVENT_RELAY_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_EVENT_RELAY_SERVICE_ID }}
      RAILWAY_STAGING_PROJECTION_CONSUMER_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_PROJECTION_CONSUMER_SERVICE_ID }}
      RAILWAY_STAGING_WORKER_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_WORKER_SERVICE_ID }}
      RAILWAY_STAGING_FRONTEND_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_FRONTEND_SERVICE_ID }}
      RAILWAY_STAGING_KEYCLOAK_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_KEYCLOAK_SERVICE_ID }}
      RAILWAY_STAGING_DB_OPS_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_DB_OPS_SERVICE_ID }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Load deploy flags from config
        env:
          RAILWAY_DEBUG_INPUT: ${{ inputs.railway_debug }}
        run: |
          bash tool/ci/load_deploy_flags.sh "$RAILWAY_ENVIRONMENT" "$RAILWAY_DEBUG_INPUT" >> "$GITHUB_ENV"
      - name: Set up deploy tooling (cached)
        uses: ./.github/actions/deploy-tooling
      - name: Shut down staging Railway services
        run: |
          SHUTDOWN_SUMMARY_PATH="$RUNNER_TEMP/shutdown-services.txt" \
          bash tool/ci/shutdown_railway_staging_services.sh
      - name: Write staging shutdown summary
        if: always()
        run: |
          {
            echo "## Railway Shutdown"
            echo "- Environment: staging"
            echo "- Job status: ${{ job.status }}"
            echo "- Shutdown method: railway down"
            if [[ -s "$RUNNER_TEMP/shutdown-services.txt" ]]; then
              echo "- Shut down services:"
              while IFS= read -r service; do
                echo "  - $service"
              done < "$RUNNER_TEMP/shutdown-services.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
