name: event-log-maintenance

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      stream_name:
        description: "Event stream name ({system}.{env}.{topic})"
        required: true
        type: string
      before:
        description: "Optional cutoff timestamp (RFC3339)"
        required: false
        type: string
      to_id:
        description: "Optional explicit max id boundary"
        required: false
        type: string
      prune:
        description: "Prune exported range"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Run export in dry-run mode"
        required: true
        default: true
        type: boolean
      replay_from_id:
        description: "Replay preview from id"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  maintenance:
    name: storage-report-export-replay-preview
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    concurrency:
      group: ${{ inputs.target_env == 'prod' && 'prod-db-ops' || format('event-log-maintenance-{0}', inputs.target_env) }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve DATABASE_URL
        if: inputs.target_env != 'prod'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.target_env }}" in
            dev)
              echo "DATABASE_URL=${{ secrets.DEV_DATABASE_RUNTIME_URL }}" >> "$GITHUB_ENV"
              ;;
            staging)
              echo "DATABASE_URL=${{ secrets.STAGING_DATABASE_RUNTIME_URL }}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "invalid target env" >&2
              exit 1
              ;;
          esac

      - name: Install deps
        if: inputs.target_env != 'prod'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Storage report
        if: inputs.target_env != 'prod'
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$DATABASE_URL" \
          EVENT_LOG_RETENTION_DAYS=30 \
          bash tool/db/event_log_storage_report.sh \
            --output-json build/event-log/storage_report.json \
            --output-text build/event-log/storage_report.txt

      - name: Export and verify
        if: inputs.target_env != 'prod'
        shell: bash
        env:
          EVENT_LOG_ARCHIVE_ENCRYPTION_REQUIRED: "true"
          EVENT_LOG_RETENTION_DAYS: "30"
          EVENT_LOG_PRUNE_BATCH_SIZE: "1000"
          EVENT_LOG_ARCHIVE_PREFIX: event-log
        run: |
          set -euo pipefail
          ARGS=(
            --stream-name "${{ inputs.stream_name }}"
            --output "build/event-log/export.jsonl"
            --manifest-output "build/event-log/export.manifest.json"
            --archive-uri "file://$PWD/build/event-log/export.remote.jsonl"
          )

          if [[ -n "${{ inputs.before }}" ]]; then
            ARGS+=(--before "${{ inputs.before }}")
          fi

          if [[ -n "${{ inputs.to_id }}" ]]; then
            ARGS+=(--to-id "${{ inputs.to_id }}")
          fi

          if [[ "${{ inputs.prune }}" == "true" ]]; then
            ARGS+=(--prune)
          fi

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ARGS+=(--dry-run)
          fi

          DATABASE_URL="$DATABASE_URL" bash tool/db/export_event_log.sh "${ARGS[@]}"

      - name: Replay preview
        if: inputs.target_env != 'prod'
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_URL="$DATABASE_URL" \
          EVENT_LOG_REPLAY_BATCH_SIZE=1000 \
          bash tool/db/replay_event_log.sh \
            --mode hot-preview \
            --stream-name "${{ inputs.stream_name }}" \
            --service-name projection-consumer \
            --consumer-name replay-maintenance-preview \
            --from-id "${{ inputs.replay_from_id }}"

      - name: Load Railway CLI version
        if: inputs.target_env == 'prod'
        run: |
          source config/ci/deploy.common.env
          echo "RAILWAY_CLI_VERSION=$RAILWAY_CLI_VERSION" >> "$GITHUB_ENV"

      - name: Add local bin directory to PATH
        if: inputs.target_env == 'prod'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Railway CLI
        if: inputs.target_env == 'prod'
        run: bash tool/ci/install_railway_cli.sh

      - name: Deploy prod db-ops service
        if: inputs.target_env == 'prod'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: prod
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_PROD_DB_OPS_SERVICE_ID }}
        run: bash tool/ci/deploy_db_ops.sh

      - name: Run prod event-log maintenance over Railway private networking
        if: inputs.target_env == 'prod'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: prod
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_PROD_DB_OPS_SERVICE_ID }}
          DB_OPS_EVENT_LOG_STREAM_NAME: ${{ inputs.stream_name }}
          DB_OPS_EVENT_LOG_BEFORE: ${{ inputs.before }}
          DB_OPS_EVENT_LOG_TO_ID: ${{ inputs.to_id }}
          DB_OPS_EVENT_LOG_PRUNE: ${{ inputs.prune }}
          DB_OPS_EVENT_LOG_DRY_RUN: ${{ inputs.dry_run }}
          DB_OPS_EVENT_LOG_REPLAY_FROM_ID: ${{ inputs.replay_from_id }}
          DB_OPS_EVENT_LOG_ARCHIVE_ENCRYPTION_REQUIRED: "true"
          DB_OPS_EVENT_LOG_RETENTION_DAYS: "30"
          DB_OPS_EVENT_LOG_PRUNE_BATCH_SIZE: "1000"
          DB_OPS_EVENT_LOG_ARCHIVE_PREFIX: event-log
        run: bash tool/ci/run_db_ops.sh event-log-maintenance

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: event-log-maintenance-${{ inputs.target_env }}
          path: build/event-log
