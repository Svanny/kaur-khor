name: railway-memory-reclaim

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment scope"
        required: true
        default: all
        type: choice
        options:
          - all
          - staging
          - prod
      include_frontend:
        description: "Restart the frontend service when configured"
        required: true
        default: true
        type: boolean
      include_keycloak:
        description: "Restart the Keycloak service when configured"
        required: true
        default: true
        type: boolean
      include_db_ops:
        description: "Restart the db-ops service too"
        required: true
        default: false
        type: boolean
      railway_debug:
        description: "Enable safe verbose Railway restart logs"
        required: false
        default: false
        type: boolean
      confirm_prod_restart:
        description: "Required for prod or all: type CONFIRM_PROD_MEMORY_RESTART"
        required: false
        type: string
  workflow_run:
    workflows:
      - deploy
      - deploy-frontend-staging
      - deploy-keycloak-staging
    types:
      - completed
permissions:
  contents: read

jobs:
  reclaim-staging:
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target_env == 'all' || inputs.target_env == 'staging')) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      )
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging-db-ops
      cancel-in-progress: false
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: staging
      RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_API_SERVICE_ID }}
      RAILWAY_EVENT_RELAY_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_EVENT_RELAY_SERVICE_ID }}
      RAILWAY_PROJECTION_CONSUMER_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_PROJECTION_CONSUMER_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_WORKER_SERVICE_ID }}
      RAILWAY_FRONTEND_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_FRONTEND_SERVICE_ID }}
      RAILWAY_KEYCLOAK_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_KEYCLOAK_SERVICE_ID }}
      RAILWAY_DB_OPS_SERVICE_ID: ${{ secrets.RAILWAY_STAGING_DB_OPS_SERVICE_ID }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
      - name: Resolve reclaim inputs for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "INCLUDE_FRONTEND=${{ inputs.include_frontend }}"
            echo "INCLUDE_KEYCLOAK=${{ inputs.include_keycloak }}"
            echo "INCLUDE_DB_OPS=${{ inputs.include_db_ops }}"
            echo "RAILWAY_DEBUG_INPUT=${{ inputs.railway_debug }}"
          } >> "$GITHUB_ENV"
      - name: Resolve reclaim inputs for automatic runs
        if: github.event_name == 'workflow_run'
        run: |
          {
            echo "INCLUDE_FRONTEND=true"
            echo "INCLUDE_KEYCLOAK=true"
            echo "INCLUDE_DB_OPS=false"
            echo "RAILWAY_DEBUG_INPUT=false"
          } >> "$GITHUB_ENV"
      - name: Load deploy flags from config
        run: |
          bash tool/ci/load_deploy_flags.sh "$RAILWAY_ENVIRONMENT" "$RAILWAY_DEBUG_INPUT" >> "$GITHUB_ENV"
      - name: Set up deploy tooling (cached)
        uses: ./.github/actions/deploy-tooling
      - name: Restart staging Railway services to reclaim process memory
        run: |
          RESTART_SUMMARY_PATH="$RUNNER_TEMP/restarted-services.txt" \
          RESTART_SKIPPED_PATH="$RUNNER_TEMP/skipped-services.txt" \
          bash tool/ci/restart_railway_services.sh
      - name: Write staging reclaim summary
        if: always()
        run: |
          {
            echo "## Railway Memory Reclaim"
            echo "- Environment: staging"
            echo "- Job status: ${{ job.status }}"
            echo "- Reclaim method: Railway service restart"
            echo "- Trigger: ${{ github.event_name }}"
            if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
              echo "- Triggering workflow: ${{ github.event.workflow_run.name }}"
              echo "- Triggering conclusion: ${{ github.event.workflow_run.conclusion }}"
              echo "- Triggering branch: ${{ github.event.workflow_run.head_branch }}"
            fi
            if [[ -s "$RUNNER_TEMP/restarted-services.txt" ]]; then
              echo "- Restarted services:"
              while IFS= read -r service; do
                echo "  - $service"
              done < "$RUNNER_TEMP/restarted-services.txt"
            fi
            if [[ -s "$RUNNER_TEMP/skipped-services.txt" ]]; then
              echo "- Skipped optional services:"
              while IFS= read -r service; do
                echo "  - $service"
              done < "$RUNNER_TEMP/skipped-services.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  reclaim-prod:
    if: github.event_name == 'workflow_dispatch' && (inputs.target_env == 'all' || inputs.target_env == 'prod')
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-db-ops
      cancel-in-progress: false
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: prod
      RAILWAY_API_SERVICE_ID: ${{ secrets.RAILWAY_PROD_API_SERVICE_ID }}
      RAILWAY_EVENT_RELAY_SERVICE_ID: ${{ secrets.RAILWAY_PROD_EVENT_RELAY_SERVICE_ID }}
      RAILWAY_PROJECTION_CONSUMER_SERVICE_ID: ${{ secrets.RAILWAY_PROD_PROJECTION_CONSUMER_SERVICE_ID }}
      RAILWAY_WORKER_SERVICE_ID: ${{ secrets.RAILWAY_PROD_WORKER_SERVICE_ID }}
      RAILWAY_FRONTEND_SERVICE_ID: ${{ secrets.RAILWAY_PROD_FRONTEND_SERVICE_ID }}
      RAILWAY_KEYCLOAK_SERVICE_ID: ${{ secrets.RAILWAY_PROD_KEYCLOAK_SERVICE_ID }}
      RAILWAY_DB_OPS_SERVICE_ID: ${{ secrets.RAILWAY_PROD_DB_OPS_SERVICE_ID }}
      INCLUDE_FRONTEND: ${{ inputs.include_frontend }}
      INCLUDE_KEYCLOAK: ${{ inputs.include_keycloak }}
      INCLUDE_DB_OPS: ${{ inputs.include_db_ops }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Require explicit prod confirmation
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_prod_restart }}" != "CONFIRM_PROD_MEMORY_RESTART" ]]; then
            echo "error: prod memory reclaim requires confirm_prod_restart=CONFIRM_PROD_MEMORY_RESTART" >&2
            exit 1
          fi
      - name: Load deploy flags from config
        env:
          RAILWAY_DEBUG_INPUT: ${{ inputs.railway_debug }}
        run: |
          bash tool/ci/load_deploy_flags.sh "$RAILWAY_ENVIRONMENT" "$RAILWAY_DEBUG_INPUT" >> "$GITHUB_ENV"
      - name: Set up deploy tooling (cached)
        uses: ./.github/actions/deploy-tooling
      - name: Restart prod Railway services to reclaim process memory
        run: |
          RESTART_SUMMARY_PATH="$RUNNER_TEMP/restarted-services.txt" \
          RESTART_SKIPPED_PATH="$RUNNER_TEMP/skipped-services.txt" \
          bash tool/ci/restart_railway_services.sh
      - name: Write prod reclaim summary
        if: always()
        run: |
          {
            echo "## Railway Memory Reclaim"
            echo "- Environment: prod"
            echo "- Job status: ${{ job.status }}"
            echo "- Reclaim method: Railway service restart"
            if [[ -s "$RUNNER_TEMP/restarted-services.txt" ]]; then
              echo "- Restarted services:"
              while IFS= read -r service; do
                echo "  - $service"
              done < "$RUNNER_TEMP/restarted-services.txt"
            fi
            if [[ -s "$RUNNER_TEMP/skipped-services.txt" ]]; then
              echo "- Skipped optional services:"
              while IFS= read -r service; do
                echo "  - $service"
              done < "$RUNNER_TEMP/skipped-services.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
