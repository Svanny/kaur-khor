name: release-build

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/release-build.yml'
      - '.github/workflows/deploy.yml'
      - 'tool/ci/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-build-main
  cancel-in-progress: false

jobs:
  container-build-push:
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image_digest: ${{ steps.meta.outputs.image_digest }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      migration_checksum: ${{ steps.meta.outputs.migration_checksum }}
      metadata_file: ${{ steps.meta.outputs.metadata_file }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Log into GHCR using GITHUB_TOKEN
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$CR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push container image
        id: push
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="ghcr.io/${OWNER_LC}/banji-api"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            -f apps/api/Dockerfile \
            --label "org.opencontainers.image.revision=$COMMIT_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.created=$BUILD_TIME" \
            -t "$IMAGE_NAME:$COMMIT_SHA" \
            -t "$IMAGE_NAME:main-$RUN_NUMBER" \
            .
          docker push "$IMAGE_NAME:$COMMIT_SHA"
          docker push "$IMAGE_NAME:main-$RUN_NUMBER"
      - name: Resolve image digest and prepare metadata
        id: meta
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="ghcr.io/${OWNER_LC}/banji-api"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_NAME:$COMMIT_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          IMAGE_REF="$IMAGE_NAME@$DIGEST"
          MIGRATION_CHECKSUM="$(find apps/api/migrations -type f -name '*.sql' -print0 | sort -z | xargs -0 cat | sha256sum | awk '{print $1}')"
          METADATA_FILE="build-metadata.json"
          jq -n \
            --arg commit_sha "$COMMIT_SHA" \
            --arg run_id "$RUN_ID" \
            --arg image_name "$IMAGE_NAME" \
            --arg image_digest "$DIGEST" \
            --arg image_ref "$IMAGE_REF" \
            --arg migration_checksum "$MIGRATION_CHECKSUM" \
            '{commit_sha: $commit_sha, run_id: $run_id, image_name: $image_name, image_digest: $image_digest, image_ref: $image_ref, migration_checksum: $migration_checksum}' > "$METADATA_FILE"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "migration_checksum=$MIGRATION_CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "metadata_file=$METADATA_FILE" >> "$GITHUB_OUTPUT"
      - name: Upload build metadata
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: release-build-metadata
          path: ${{ steps.meta.outputs.metadata_file }}
          if-no-files-found: error
      - name: Container vulnerability scan (wall-tier, non-blocking)
        continue-on-error: true
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="ghcr.io/${OWNER_LC}/banji-api"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.59.1 \
            image --severity HIGH,CRITICAL "$IMAGE_NAME:$COMMIT_SHA"

  deploy:
    needs: container-build-push
    uses: ./.github/workflows/deploy.yml
    with:
      image_ref: ${{ needs.container-build-push.outputs.image_ref }}
      image_digest: ${{ needs.container-build-push.outputs.image_digest }}
      commit_sha: ${{ needs.container-build-push.outputs.commit_sha }}
      migration_checksum: ${{ needs.container-build-push.outputs.migration_checksum }}
    secrets: inherit
