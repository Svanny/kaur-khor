name: Deploy tooling with cache
description: Restore cached deploy tooling and install missing dependencies
runs:
  using: composite
  steps:
    - name: Restore deploy tool caches
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/bin
          ~/.cargo/registry
          ~/.cargo/git
          ~/.local/bin
        key: deploy-tools-${{ runner.os }}-rust-stable-sqlx-${{ env.SQLX_CLI_VERSION }}-railway-${{ env.RAILWAY_CLI_VERSION }}
        restore-keys: |
          deploy-tools-${{ runner.os }}-rust-stable-sqlx-${{ env.SQLX_CLI_VERSION }}-
          deploy-tools-${{ runner.os }}-rust-stable-
          deploy-tools-${{ runner.os }}-

    - name: Ensure cached bin path is on PATH
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install postgres client if missing
      shell: bash
      run: |
        set -euo pipefail
        if command -v psql >/dev/null 2>&1; then
          echo "psql already installed"
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Install Rust stable toolchain
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal

    - name: Install sqlx-cli if missing
      shell: bash
      run: |
        set -euo pipefail

        sqlx_matches_expected_version() {
          local actual
          actual="$(sqlx --version 2>/dev/null | awk '{print $2}')"
          [[ -n "$actual" && "$actual" == "$SQLX_CLI_VERSION" ]]
        }

        if command -v sqlx >/dev/null 2>&1; then
          if sqlx_matches_expected_version; then
            echo "sqlx ${SQLX_CLI_VERSION} already installed"
            sqlx --version || true
            exit 0
          fi

          echo "sqlx version mismatch; reinstalling ${SQLX_CLI_VERSION}"
          sqlx --version || true
        fi
        cargo +stable install sqlx-cli \
          --version "${SQLX_CLI_VERSION}" \
          --locked \
          --no-default-features \
          --features rustls,postgres

    - name: Install Railway CLI if missing
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"

        railway_version_matches_expected() {
          local binary="$1"
          local actual
          actual="$("$binary" --version 2>/dev/null | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          [[ -n "$actual" && "$actual" == "$RAILWAY_CLI_VERSION" ]]
        }

        if [[ -x "$HOME/.local/bin/railway" ]]; then
          if railway_version_matches_expected "$HOME/.local/bin/railway"; then
            echo "railway ${RAILWAY_CLI_VERSION} already installed"
            "$HOME/.local/bin/railway" --version || true
            exit 0
          fi

          echo "railway version mismatch; reinstalling ${RAILWAY_CLI_VERSION}"
          "$HOME/.local/bin/railway" --version || true
          rm -f "$HOME/.local/bin/railway"
        fi

        if command -v railway >/dev/null 2>&1; then
          if railway_version_matches_expected "$(command -v railway)"; then
            cp "$(command -v railway)" "$HOME/.local/bin/railway"
            chmod +x "$HOME/.local/bin/railway"
            echo "railway ${RAILWAY_CLI_VERSION} already installed"
            "$HOME/.local/bin/railway" --version || true
            exit 0
          fi
        fi

        npm install --global --prefix "$HOME/.local" "@railway/cli@${RAILWAY_CLI_VERSION}"
        if [[ ! -x "$HOME/.local/bin/railway" ]]; then
          echo "error: railway CLI installation did not produce a usable binary" >&2
          exit 1
        fi

        if ! railway_version_matches_expected "$HOME/.local/bin/railway"; then
          echo "error: installed railway CLI version does not match ${RAILWAY_CLI_VERSION}" >&2
          "$HOME/.local/bin/railway" --version || true
          exit 1
        fi

        "$HOME/.local/bin/railway" --version || true
